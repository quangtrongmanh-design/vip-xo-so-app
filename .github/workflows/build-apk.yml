name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Generate Fresh V2 Android Project & Build Direct
        run: |
          # 1. Đổi tên trong pubspec.yaml thành gạch dưới chuẩn Dart
          sed -i 's/^name: .*/name: vip_xo_so_app/' pubspec.yaml

          # 2. Xóa thư mục android cũ và tạo lại bộ khung v2 sạch sẽ
          rm -rf android
          cd ..
          flutter create --platforms=android --org=com.example vip_xo_so_app_temp
          cp -r vip_xo_so_app_temp/android vip-xo-so-app/
          rm -rf vip_xo_so_app_temp
          cd vip-xo-so-app

          # 3. Lấy dependencies và build trực tiếp qua Gradle wrapper
          flutter pub get
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
