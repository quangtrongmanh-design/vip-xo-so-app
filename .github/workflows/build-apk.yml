name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'
          cache: true

      - name: Setup Clean Pure Android Project
        run: |
          # 1. Khởi tạo dự án Flutter chuẩn từ gốc
          flutter create --org com.vip.xoso --project-name vip_xo_so_app .

          # 2. Xóa sạch file build.gradle cũ của app và viết lại file build.gradle chuẩn thuần túy Android 100% không dính dáng hàm flutter lỗi
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "com.vip.xoso.vip_xo_so_app"
              compileSdkVersion 34

              defaultConfig {
                  applicationId "com.vip.xoso.vip_xo_so_app"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_7
                  targetCompatibility JavaVersion.VERSION_1_7
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 3. Ghi đè AndroidManifest.xml chuẩn xác với tên "Dò số"
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.vip.xoso.vip_xo_so_app">
              <application
                  android:label="Dò số"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 4. Tiêm mã nguồn giao diện hoàn chỉnh vào lib/main.dart
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Dò số',
                theme: ThemeData(
                  primarySwatch: Colors.teal,
                  scaffoldBackgroundColor: const Color(0xFF0F252D),
                ),
                home: const XoSoHomePage(),
                debugShowCheckedModeBanner: false,
              );
            }
          }

          class XoSoHomePage extends StatefulWidget {
            const XoSoHomePage({Key? key}) : super(key: key);

            @override
            State<XoSoHomePage> createState() => _XoSoHomePageState();
          }

          class _XoSoHomePageState extends State<XoSoHomePage> {
            bool hasSearched = false;
            int _currentIndex = 0;

            final List> lotteryResults = [
              {'giai': 'G8', 'so': '0197838', 'tien': '100.000 VNĐ'},
              {'giai': 'G7', 'so': '1967326', 'tien': '200.000 VNĐ'},
              {'giai': 'G6', 'so': '2885080', 'tien': '400.000 VNĐ'},
              {'giai': 'G5', 'so': '1252951', 'tien': '1.000.000 VNĐ'},
              {'giai': 'G4', 'so': '2382333', 'tien': '3.000.000 VNĐ'},
              {'giai': 'G3', 'so': '1887886', 'tien': '10.000.000 VNĐ'},
              {'giai': 'G2', 'so': '1847925', 'tien': '15.000.000 VNĐ'},
              {'giai': 'G1', 'so': '2215488', 'tien': '30.000.000 VNĐ'},
              {'giai': 'ĐB', 'so': '30102026', 'tien': '2.000.000.000 VNĐ'},
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F252D),
                body: SafeArea(
                  child: Column(
                    children: [
                      // Header App
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
                        color: const Color(0xFF13323B),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Row(
                              children: [
                                Container(
                                  padding: const EdgeInsets.all(6),
                                  decoration: BoxDecoration(
                                    color: Colors.redAccent,
                                    borderRadius: BorderRadius.circular(6),
                                  ),
                                  child: const Text('🎟️', style: TextStyle(fontSize: 16)),
                                ),
                                const SizedBox(width: 8),
                                Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: const [
                                    Text(
                                      'DÒ SỐ',
                                      style: TextStyle(
                                        color: Colors.white,
                                        fontSize: 18,
                                        fontWeight: FontWeight.bold,
                                        letterSpacing: 1,
                                      ),
                                    ),
                                    Text(
                                      'v5.4 Pro • Tự động cập nhật',
                                      style: TextStyle(color: Colors.white60, fontSize: 10),
                                    ),
                                  ],
                                ),
                              ],
                            ),
                            Row(
                              children: const [
                                Icon(Icons.refresh, color: Colors.white70, size: 20),
                                SizedBox(width: 16),
                                Icon(Icons.settings, color: Colors.white70, size: 20),
                              ],
                            ),
                          ],
                        ),
                      ),

                      // Banner VIP COFFEE QC
                      Container(
                        color: const Color(0xFFFFF3CD),
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Expanded(
                              child: Row(
                                children: const [
                                  Text('🔥 ', style: TextStyle(fontSize: 12)),
                                  Expanded(
                                    child: Text(
                                      'VIP COFFEE – Liên hệ QC: 0819914199',
                                      style: TextStyle(
                                        color: Color(0xFF856404),
                                        fontSize: 11,
                                        fontWeight: FontWeight.bold,
                                      ),
                                      overflow: TextOverflow.ellipsis,
                                    ),
                                  ),
                                ],
                              ),
                            ),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 3),
                              decoration: BoxDecoration(
                                color: const Color(0xFFFFC107),
                                borderRadius: BorderRadius.circular(4),
                              ),
                              child: const Text(
                                'LIÊN HỆ',
                                style: TextStyle(
                                  color: Colors.black87,
                                  fontSize: 10,
                                  fontWeight: FontWeight.bold,
                                ),
                              ),
                            ),
                            const SizedBox(width: 6),
                            const Icon(Icons.close, size: 14, color: Color(0xFF856404)),
                          ],
                        ),
                      ),

                      // Khung chọn Ngày & Đài
                      Container(
                        margin: const EdgeInsets.all(12),
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(
                          color: const Color(0xFF183B46),
                          borderRadius: BorderRadius.circular(10),
                          border: Border.all(color: Colors.white12),
                        ),
                        child: Column(
                          children: [
                            Row(
                              children: [
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      const Text('Ngày', style: TextStyle(color: Colors.white70, fontSize: 12)),
                                      const SizedBox(height: 4),
                                      Container(
                                        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
                                        decoration: BoxDecoration(
                                          color: Colors.white,
                                          borderRadius: BorderRadius.circular(6),
                                        ),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                          children: const [
                                            Text('27 / 10 / 2026', style: TextStyle(color: Colors.black87, fontSize: 13)),
                                            Icon(Icons.calendar_today, size: 16, color: Colors.grey),
                                          ],
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      const Text('Đài', style: TextStyle(color: Colors.white70, fontSize: 12)),
                                      const SizedBox(height: 4),
                                      Container(
                                        padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
                                        decoration: BoxDecoration(
                                          color: Colors.white,
                                          borderRadius: BorderRadius.circular(6),
                                        ),
                                        child: Row(
                                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                          children: const [
                                            Text('An Giang', style: TextStyle(color: Colors.black87, fontSize: 13, fontWeight: FontWeight.bold)),
                                            Icon(Icons.arrow_drop_down, color: Colors.grey),
                                          ],
                                        ),
                                      ),
                                    ],
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 12),
                            SizedBox(
                              width: double.infinity,
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFF1976D2),
                                  padding: const EdgeInsets.symmetric(vertical: 12),
                                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(6)),
                                ),
                                onPressed: () {
                                  setState(() {
                                    hasSearched = true;
                                  });
                                },
                                child: const Text(
                                  'DÒ NGAY',
                                  style: TextStyle(color: Colors.white, fontSize: 15, fontWeight: FontWeight.bold, letterSpacing: 1),
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),

                      // Nội dung kết quả hoặc trạng thái chờ
                      Expanded(
                        child: Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 12),
                          child: !hasSearched
                              ? Center(
                                  child: Container(
                                    padding: const EdgeInsets.all(20),
                                    decoration: BoxDecoration(
                                      color: const Color(0xFF163742),
                                      borderRadius: BorderRadius.circular(10),
                                      border: Border.all(color: const Color(0xFFD4AF37), width: 1.5),
                                    ),
                                    child: const Text(
                                      '⏳ ĐANG CẬP NHẬT KẾT QUẢ,\nVUI LÒNG CHỜ TRONG GIÂY LÁT...',
                                      textAlign: TextAlign.center,
                                      style: TextStyle(
                                        color: Color(0xFFFFD700),
                                        fontSize: 14,
                                        fontWeight: FontWeight.bold,
                                        height: 1.5,
                                      ),
                                    ),
                                  ),
                                )
                              : SingleChildScrollView(
                                  child: Column(
                                    children: [
                                      Container(
                                        width: double.infinity,
                                        padding: const EdgeInsets.symmetric(vertical: 8),
                                        decoration: BoxDecoration(
                                          color: const Color(0xFFE0E0E0),
                                          borderRadius: BorderRadius.circular(6),
                                          border: Border.all(color: const Color(0xFFD4AF37)),
                                        ),
                                        child: const Text(
                                          'KẾT QUẢ ĐÃ CÔNG BỐ\n(AN GIANG)',
                                          textAlign: TextAlign.center,
                                          style: TextStyle(
                                            color: Color(0xFF8B0000),
                                            fontSize: 14,
                                            fontWeight: FontWeight.bold,
                                          ),
                                        ),
                                      ),
                                      const SizedBox(height: 8),
                                      Table(
                                        border: TableBorder.all(color: Colors.white24),
                                        columnWidths: const {
                                          0: FlexColumnWidth(1.2),
                                          1: FlexColumnWidth(2.5),
                                          2: FlexColumnWidth(2.8),
                                        },
                                        children: [
                                          TableRow(
                                            decoration: const BoxDecoration(color: Color(0xFF13323B)),
                                            children: const [
                                              Padding(padding: EdgeInsets.all(8), child: Text('Giải', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold), textAlign: TextAlign.center)),
                                              Padding(padding: EdgeInsets.all(8), child: Text('Kết quả', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold), textAlign: TextAlign.center)),
                                              Padding(padding: EdgeInsets.all(8), child: Text('Trị giá', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold), textAlign: TextAlign.center)),
                                            ],
                                          ),
                                          for (var item in lotteryResults)
                                            TableRow(
                                              decoration: BoxDecoration(
                                                color: item['giai'] == 'ĐB' ? const Color(0xFF2A2000) : const Color(0xFF163742),
                                              ),
                                              children: [
                                                Padding(
                                                  padding: const EdgeInsets.all(8),
                                                  child: Text(item['giai']!, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold), textAlign: TextAlign.center),
                                                ),
                                                Padding(
                                                  padding: const EdgeInsets.all(8),
                                                  child: Text(
                                                    item['so']!,
                                                    style: TextStyle(
                                                      color: item['giai'] == 'ĐB' ? const Color(0xFFFF5252) : const Color(0xFFFFD700),
                                                      fontWeight: FontWeight.bold,
                                                      fontSize: item['giai'] == 'ĐB' ? 15 : 13,
                                                    ),
                                                    textAlign: TextAlign.center,
                                                  ),
                                                ),
                                                Padding(
                                                  padding: const EdgeInsets.all(8),
                                                  child: Text(item['tien']!, style: const TextStyle(color: Colors.white70, fontSize: 11), textAlign: TextAlign.center),
                                                ),
                                              ],
                                            ),
                                        ],
                                      ),
                                    ],
                                  ),
                                ),
                        ),
                      ),

                      // Thanh điều hướng đáy
                      Container(
                        padding: const EdgeInsets.symmetric(vertical: 8),
                        color: const Color(0xFF0C1D23),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceAround,
                          children: [
                            _buildNavItem(Icons.search, 'Dò ngay', 0),
                            _buildNavItem(Icons.language, 'Trực tiếp Web', 1),
                            _buildNavItem(Icons.calendar_month, 'Lịch quay', 2),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _buildNavItem(IconData icon, String label, int index) {
              bool isSelected = _currentIndex == index;
              return GestureDetector(
                onTap: () {
                  setState(() {
                    _currentIndex = index;
                  });
                },
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Icon(icon, color: isSelected ? const Color(0xFFFFD700) : Colors.white60, size: 22),
                    const SizedBox(height: 2),
                    Text(
                      label,
                      style: TextStyle(
                        color: isSelected ? const Color(0xFFFFD700) : Colors.white60,
                        fontSize: 11,
                        fontWeight: isSelected ? FontWeight.bold : FontWeight.normal,
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build Pure Android APK via Gradle
        run: |
          # Đóng gói APK trực tiếp bằng Gradle cực kỳ mượt mà
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vip-xo-so-apk-debug
          path: build/app/outputs/apk/debug/app-debug.apk
