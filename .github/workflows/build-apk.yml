name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Build Standard Flutter APK
        run: |
          # 1. Đồng bộ tên project trong pubspec.yaml
          sed -i 's/^name: .*/name: vip_xo_so_app/' pubspec.yaml

          # 2. Xóa khung android cũ và tái lập khung Android V2
          rm -rf android
          flutter create . --platforms=android --org=com.example --project-name=vip_xo_so_app

          # 3. Ghi file build.gradle tiêu chuẩn tương thích 100% Java 17 & Flutter SDK
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.example.vip_xo_so_app"
              compileSdk 34
              ndkVersion "25.1.8937393"

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              defaultConfig {
                  applicationId "com.example.vip_xo_so_app"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOF

          # 4. Phủ Icon cá nhân hóa chất lượng cao vào toàn bộ các thư mục mipmap
          for md in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$md
            curl -L "https://i.imgur.com/8QG9sWb.png" -o android/app/src/main/res/$md/ic_launcher.png
          done

          # 5. Tải dependencies và thực hiện build debug APK
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Prepare APK Output
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
