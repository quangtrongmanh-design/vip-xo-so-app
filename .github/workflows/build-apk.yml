name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffold & Config
        run: |
          # Tự động tạo bộ khung chuẩn Android v2 ngay trên server
          flutter create . --platforms=android --org com.vip.xoso --project-name vip_xo_so_app
          
          # Vá lỗi cấu hình Gradle buildconfig tương thích ngược
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Debug
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
