name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Create Fresh Clean Project & Copy Source
        run: |
          # Lưu lại các file code lib hiện tại của anh
          mkdir -p temp_lib
          cp -r lib/* temp_lib/
          
          # Tạo một dự án Flutter chuẩn mới tinh đè lên thư mục gốc
          flutter create . --org com.vip.xoso --project-name vip_xo_so_app --force
          
          # Khôi phục lại code lib của anh vào dự án sạch
          rm -rf lib/*
          cp -r temp_lib/* lib/

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
