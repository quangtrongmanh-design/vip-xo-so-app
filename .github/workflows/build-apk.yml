name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Build Perfect APK with Custom App Icon
        run: |
          # 1. Đồng bộ tên project trong pubspec.yaml
          sed -i 's/^name: .*/name: vip_xo_so_app/' pubspec.yaml

          # 2. Tạo khung Android V2
          rm -rf android
          flutter create . --platforms=android --org=com.example --project-name=vip_xo_so_app

          # 3. Phủ Icon đỏ vàng kim vào toàn bộ thư mục mipmap
          mkdir -p android/app/src/main/res/mipmap-hdpi
          curl -L "https://raw.githubusercontent.com/quangtrongmanh-design/vip-xo-so-data/main/icon.png" -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          
          for md in mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$md
            cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/$md/ic_launcher.png || true
          done

          # 4. Cấu hình minSdkVersion 21
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

          # 5. Build APK Debug
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Prepare APK Output
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
