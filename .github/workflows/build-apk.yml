name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Scaffold & Restore Source Code
        run: |
          # 1. Lưu lại thư mục lib và pubspec.yaml của anh vào thư mục dự phòng
          mkdir -p my_backup
          cp -r lib my_backup/
          cp pubspec.yaml my_backup/
          
          # 2. Tạo mới dự án chuẩn để lấy toàn bộ hệ thống thư mục Android v2
          flutter create . --platforms=android --org com.vip.xoso --project-name vip_xo_so_app
          
          # 3. Phục hồi hoàn toàn mã nguồn v6.2 Pro nguyên bản của anh vào dự án
          rm -rf lib
          cp -r my_backup/lib .
          cp my_backup/pubspec.yaml .
          
          # 4. Vá cờ buildconfig tương thích ngược cho Gradle
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Debug
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
