name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Build Perfect APK with Custom App Icon
        run: |
          # 1. Đồng bộ tên project trong pubspec.yaml
          sed -i 's/^name: .*/name: vip_xo_so_app/' pubspec.yaml

          # 2. Re-create khung Android V2 chuẩn
          rm -rf android
          flutter create . --platforms=android --org=com.example --project-name=vip_xo_so_app

          # 3. Phủ Icon đỏ vàng kim rực rỡ sắc nét bằng mã SVG/PNG nội tại
          cat << 'EOF' > icon.png.b64
          iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAABHNCSVQICAgIfAhkiAAAAAlwSFlz
          AAALEwAACxEBAQK1AAAAAXRSTlMAQObYZgAAABl0RVh0U29mdHdhcmUAQWRvYmUgSW1hZ2VSZWFk
          eXHJZTwAAAGTSURBVHja7ZpBCsIwEEU9S3fS3Xsn4lW8ieI1vIl4FS/iTfQOehPde9NAA00pLSpO
          44MPmEwozb/5mcmkSZs2bdr/oT0A4AC6f2EHoAewA1AD2AGoAewA1AB2AGoAewA1AB2AGsAO4Aew
          C+iS8wTo0pTGAIAnADvA3AGi8whAnx9x5nO2eI9p2sE2bX4eAnADXADMAJ4BzAAtAA34fXInCIB3
          AM4A3AA6AFqS+z7u9XUBGACvAGwAuo3f38o04+2mC4ABcAeAAnADaAHs+mS7o/u9m38AmAE4AnAD
          aAHows31PwCvAPoANIBbAIsB2w3f8I3/m+Y/AagBOAJwA2gBfP6X3ADMAAoAnQH3vX2898/6
          EOF
          base64 -d icon.png.b64 > default_icon.png

          for md in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$md
            cp default_icon.png android/app/src/main/res/$md/ic_launcher.png
          done

          # 4. Cấu hình minSdkVersion 21
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

          # 5. Build APK Debug
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Prepare APK Output
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
