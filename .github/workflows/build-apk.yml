name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Regenerate Supported V2 Android Project
        run: |
          # 1. Tạm sửa tên trong pubspec.yaml thành gạch dưới để flutter create không bị bắt bẻ tên repo
          sed -i 's/^name: .*/name: vip_xo_so_app/' pubspec.yaml

          # 2. Xóa sạch thư mục android cũ
          rm -rf android

          # 3. Sử dụng Flutter tự sinh toàn bộ cấu trúc Android chuẩn tương thích hoàn toàn với Flutter 3.22.x
          flutter create . --platforms=android --org=com.example

      - name: Clean & Build APK Release
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
