name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'
          cache: true

      - name: Generate Clean Project, Name "Dò số" & Remove Splash Freeze
        run: |
          # 1. Tạo mới dự án Flutter chuẩn
          flutter create --org com.vip.xoso --project-name vip_xo_so_app temp_app
          cp -r temp_app/* ./
          cp -r temp_app/.* ./ 2>/dev/null || true
          rm -rf temp_app
          
          # 2. Đổi tên ứng dụng hiển thị thành "Dò số" trong AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's@android:label="vip_xo_so_app"@android:label="Dò số"@g' "$MANIFEST_PATH"
          fi

          # 3. Xóa bỏ hoàn toàn theme màn hình chờ (splash screen) để chống treo logo khi mở app
          STYLES_PATH="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES_PATH" ]; then
            sed -i '/<item name="android:windowBackground">/d' "$STYLES_PATH"
            sed -i '/<item name="flutterEmbedding">/d' "$STYLES_PATH"
          fi

          # 4. Tạo file mã nguồn lib/main.dart tối ưu khởi chạy trực tiếp
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Dò số',
                theme: ThemeData(
                  primarySwatch: Colors.amber,
                  scaffoldBackgroundColor: const Color(0xFF121212),
                ),
                home: const HomePage(),
                debugShowCheckedModeBanner: false,
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({Key? key}) : super(key: key);

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            final List> resultRows = [
              {'title': 'Giải Đặc Biệt', 'number': '658932', 'province': 'Đài Chính'},
              {'title': 'Giải Nhất', 'number': '45120', 'province': 'Đài Chính'},
              {'title': 'Giải Nhì', 'number': '89312', 'province': 'Đài Chính'},
              {'title': 'Giải Ba', 'number': '77419', 'province': 'Đài Chính'},
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'DÒ SỐ - XSMN v6.2 PRO',
                    style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold),
                  ),
                  backgroundColor: Colors.amber,
                  centerTitle: true,
                ),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text(
                        'Kết Quả Xổ Số Miền Nam Hôm Nay',
                        style: TextStyle(
                          color: Colors.amber,
                          fontSize: 18,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 12),
                      Expanded(
                        child: ListView.builder(
                          itemCount: resultRows.length,
                          itemBuilder: (context, index) {
                            final row = resultRows[index];
                            return Card(
                              color: const Color(0xFF1E1E1E),
                              margin: const EdgeInsets.symmetric(vertical: 6),
                              child: ListTile(
                                title: Text(
                                  row['title'] ?? '',
                                  style: const TextStyle(
                                    color: Colors.white70,
                                    fontWeight: FontWeight.w500,
                                  ),
                                ),
                                trailing: Text(
                                  row['number'] ?? '',
                                  style: const TextStyle(
                                    color: Colors.amberAccent,
                                    fontSize: 20,
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                              ),
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Clean & Build Pure Gradle APK
        run: |
          flutter precache --android
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon -x compileFlutterBuildDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vip-xo-so-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
