name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Generate Fresh V2 Android Project
        run: |
          # 1. Đổi tên trong pubspec.yaml thành gạch dưới chuẩn Dart
          sed -i 's/^name: .*/name: vip_xo_so_app/' pubspec.yaml

          # 2. Xóa thư mục android cũ
          rm -rf android

          # 3. Tạo một project Flutter tạm thời với tên hợp lệ để lấy bộ khung android chuẩn v2
          cd ..
          flutter create --platforms=android --org=com.example vip_xo_so_app_temp
          
          # 4. Chép toàn bộ thư mục android chuẩn v2 sang dự án hiện tại
          cp -r vip_xo_so_app_temp/android vip-xo-so-app/
          rm -rf vip_xo_so_app_temp

      - name: Clean & Build APK Release
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons --target-platform android-arm,android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
