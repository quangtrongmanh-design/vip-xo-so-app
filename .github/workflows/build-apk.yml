name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Generate Separate Android Folder & Patch Config
        run: |
          # 1. Tạo một dự án tạm bên ngoài để lấy thư mục android chuẩn
          flutter create temp_app --org com.vip.xoso --project-name vip_xo_so_app
          
          # 2. Chép thư mục android từ dự án tạm vào dự án chính
          cp -r temp_app/android ./android
          rm -rf temp_app
          
          # 3. Vá cờ buildconfig vào gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK Debug
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
