name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (Java 11 tương thích chuẩn Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'
          cache: true

      - name: Build Standalone Flutter App
        run: |
          # 1. Tạo dự án Flutter chuẩn sạch sẽ tại thư mục hiện tại
          flutter create . --org com.vip.xoso --project-name vip_xo_so_app --platforms=android
          
          # 2. Ghi đè trực tiếp file lib/main.dart chuẩn v6.2 Pro có đầy đủ resultRows
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({Key? key}) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'VIP Xổ Số XSMN Pro',
                theme: ThemeData(
                  primarySwatch: Colors.amber,
                  scaffoldBackgroundColor: const Color(0xFF121212),
                ),
                home: const HomePage(),
                debugShowCheckedModeBanner: false,
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({Key? key}) : super(key: key);

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            final List> resultRows = [
              {'title': 'Giải Đặc Biệt', 'number': '658932', 'province': 'Đài Chính'},
              {'title': 'Giải Nhất', 'number': '45120', 'province': 'Đài Chính'},
              {'title': 'Giải Nhì', 'number': '89312', 'province': 'Đài Chính'},
              {'title': 'Giải Ba', 'number': '77419', 'province': 'Đài Chính'},
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text(
                    'VIP XỔ SỐ - XSMN v6.2 PRO',
                    style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold),
                  ),
                  backgroundColor: Colors.amber,
                  centerTitle: true,
                ),
                body: Padding(
                  padding: const EdgeInsets.all(16.0),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text(
                        'Kết Quả Xổ Số Miền Nam Hôm Nay',
                        style: TextStyle(
                          color: Colors.amber,
                          fontSize: 18,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 12),
                      Expanded(
                        child: ListView.builder(
                          itemCount: resultRows.length,
                          itemBuilder: (context, index) {
                            final row = resultRows[index];
                            return Card(
                              color: const Color(0xFF1E1E1E),
                              margin: const EdgeInsets.symmetric(vertical: 6),
                              child: ListTile(
                                title: Text(
                                  row['title'] ?? '',
                                  style: const TextStyle(
                                    color: Colors.white70,
                                    fontWeight: FontWeight.w500,
                                  ),
                                ),
                                trailing: Text(
                                  row['number'] ?? '',
                                  style: const TextStyle(
                                    color: Colors.amberAccent,
                                    fontSize: 20,
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                              ),
                            );
                          },
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 3. Tiến hành build file APK trực tiếp thông suốt
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
