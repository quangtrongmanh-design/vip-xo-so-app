name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Generate Android Structure & Backup Source
        run: |
          # 1. Lưu mã nguồn lib và pubspec vào thư mục tạm
          mkdir -p my_backup
          cp -r lib my_backup/
          cp pubspec.yaml my_backup/
          
          # 2. Tạo khung Android v2 chuẩn
          flutter create . --platforms=android --org com.vip.xoso --project-name vip_xo_so_app
          
          # 3. Phục hồi mã nguồn v6.2 Pro nguyên bản
          rm -rf lib
          cp -r my_backup/lib .
          cp my_backup/pubspec.yaml .
          
          # 4. Bật cờ buildconfig trong gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK via Gradle Direct
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
