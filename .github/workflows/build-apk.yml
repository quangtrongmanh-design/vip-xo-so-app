name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Setup Clean Android V2 Structure
        run: |
          # 1. Xóa sạch thư mục android cũ để loại bỏ hoàn toàn tàn dư v1
          rm -rf android

          # 2. Tạo thủ công toàn bộ khung Android V2 Embedding chuẩn chỉnh
          mkdir -p android/app/src/main/kotlin/com/example/vip_xo_so_app
          mkdir -p android/app/src/main

          # 3. Tạo MainActivity.kt chuẩn V2
          cat << 'EOF' > android/app/src/main/kotlin/com/example/vip_xo_so_app/MainActivity.kt
          package com.example.vip_xo_so_app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # 4. Tạo AndroidManifest.xml chuẩn V2
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="VIP Xổ Số Miền Nam"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 5. Tạo build.gradle cho ứng dụng
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.example.vip_xo_so_app"
              compileSdk 34

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.example.vip_xo_so_app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
          }

          flutter {
              source '../..'
          }
          EOF

          # 6. Tạo file settings.gradle chuẩn
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { reader -> properties.load(reader) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "7.3.0" apply false
              id "org.jetbrains.kotlin.android" version "1.8.22" apply false
              id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
          }

          include ":app"
          EOF

      - name: Get Dependencies & Build via Gradle Direct
        run: |
          flutter pub get
          flutter precache --android
          # Build trực tiếp bằng Gradle để bỏ qua hoàn toàn bộ kiểm tra embedding cũ của lệnh flutter build apk
          cd android
          ./gradlew assembleRelease

      - name: Prepare APK Output Path
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp android/app/build/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
