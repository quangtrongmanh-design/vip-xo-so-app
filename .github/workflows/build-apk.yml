name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Rebuild Fresh Android V2 Project Structure
        run: |
          # 1. Xóa thư mục android cũ để loại bỏ hoàn toàn các cấu hình V1 tàn dư
          rm -rf android

          # 2. Dùng chính Flutter CLI để tự động khởi tạo lại thư mục android chuẩn V2
          flutter create . --platforms=android --org=com.example

          # 3. Đảm bảo cấu hình v2 embedding chuẩn trong AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/android:label=".*"/android:label="VIP Xổ Số Miền Nam"/g' "$MANIFEST_PATH"
          fi

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
