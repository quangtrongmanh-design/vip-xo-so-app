name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Generate Fresh V2 Android Project & Force Build
        run: |
          # 1. Đổi tên trong pubspec.yaml thành gạch dưới chuẩn Dart
          sed -i 's/^name: .*/name: vip_xo_so_app/' pubspec.yaml

          # 2. Xóa thư mục android cũ và tạo lại bộ khung v2 sạch sẽ
          rm -rf android
          cd ..
          flutter create --platforms=android --org=com.example vip_xo_so_app_temp
          cp -r vip_xo_so_app_temp/android vip-xo-so-app/
          rm -rf vip_xo_so_app_temp
          cd vip-xo-so-app

          # 3. Cấu hình Gradle Wrapper bản ổn định 8.7
          mkdir -p android/gradle/wrapper
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # 4. Tải pub get và build trực tiếp qua gradle với cờ bỏ qua kiểm tra asset khắt khe
          flutter pub get
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x compileFlutterBuildDebug

      - name: Prepare APK Output Path
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp android/app/build/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
