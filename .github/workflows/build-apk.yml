name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Setup Valid V2 Android Project
        run: |
          # 1. Đổi tên thư mục gốc và cập nhật lại pubspec.yaml để tránh hoàn toàn lỗi tên chứa dấu gạch ngang
          cd ..
          mv $(ls -d vip-xo-so-app*) vip_xo_so_app
          cd vip_xo_so_app
          
          sed -i 's/^name: .*/name: vip_xo_so_app/' pubspec.yaml

          # 2. Xóa sạch thư mục android cũ
          rm -rf android

          # 3. Sử dụng Flutter tạo lại bộ khung Android chuẩn v2 (tự sinh gradlew đầy đủ)
          flutter create . --platforms=android --org=com.example

          # 4. Ghi đè MainActivity chuẩn v2 embedding vào đúng thư mục dự án
          mkdir -p android/app/src/main/kotlin/com/example/vip_xo_so_app
          cat << 'EOF' > android/app/src/main/kotlin/com/example/vip_xo_so_app/MainActivity.kt
          package com.example.vip_xo_so_app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

      - name: Clean & Get Dependencies
        run: |
          cd ../vip_xo_so_app
          flutter clean
          flutter pub get

      - name: Build APK via Gradle Direct
        run: |
          cd ../vip_xo_so_app/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK Output Path
        run: |
          cd ../vip_xo_so_app
          mkdir -p build/app/outputs/flutter-apk/
          cp android/app/build/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ../vip_xo_so_app/build/app/outputs/flutter-apk/app-release.apk
