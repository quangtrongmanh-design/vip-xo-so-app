name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Force Upgrade to Android v2 Embedding
        run: |
          # 1. Cập nhật AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="${applicationName}"/g' "$MANIFEST_PATH"
            if ! grep -q "flutterEmbedding" "$MANIFEST_PATH"; then
              sed -i '/<application/a \ \ \ \ <meta-data\n\ \ \ \ \ \ \ \ android:name="flutterEmbedding"\n\ \ \ \ \ \ \ \ android:value="2" \/>' "$MANIFEST_PATH"
            fi
          fi

          # 2. Xóa các file MainActivity cũ và ghi đè MainActivity Kotlin chuẩn V2
          rm -rf android/app/src/main/java
          rm -rf android/app/src/main/kotlin
          
          PACKAGE_DIR="android/app/src/main/kotlin/com/example/vip_xo_so_mien_nam"
          mkdir -p "$PACKAGE_DIR"
          
          cat << 'EOF' > "$PACKAGE_DIR/MainActivity.kt"
          package com.example.vip_xo_so_mien_nam

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
