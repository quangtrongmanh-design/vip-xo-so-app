name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Setup Android Environment & Gradle Properties
        run: |
          # 1. Tạo dự án khung Android chuẩn v2
          flutter create . --platforms=android --org com.vip.xoso --project-name vip_xo_so_app
          
          # 2. Cấu hình gradle.properties tối ưu
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048M
          android.useAndroidX=true
          android.enableJetifier=true
          android.defaults.buildfeatures.buildconfig=true
          EOF

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK Debug (Verbose Mode)
        run: flutter build apk --debug --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
