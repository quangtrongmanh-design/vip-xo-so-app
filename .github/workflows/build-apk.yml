name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Build Flutter APK Standard
        run: |
          # 1. Đồng bộ tên project
          sed -i 's/^name: .*/name: vip_xo_so_app/' pubspec.yaml

          # 2. Tạo khung android V2 nếu chưa có
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org=com.example --project-name=vip_xo_so_app
          fi

          # 3. Cập nhật minSdkVersion 21
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

          # 4. Phủ Icon cá nhân hóa vào các thư mục mipmap
          for md in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$md
            curl -L "https://i.imgur.com/8QG9sWb.png" -o android/app/src/main/res/$md/ic_launcher.png
          done

          # 5. Tải dependencies và thực hiện build APK
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Prepare APK Output
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/apk/debug/app-debug.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
